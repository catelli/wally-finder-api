[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wally-ai-api"
version = "0.1.0"
description = "Production API to detect Wally in images using YOLO tiles model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.32.0,<0.48",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "pillow>=11.0.0",
    "numpy>=1.26.0,<3",
    "opencv-python-headless>=4.10.0",
    "ultralytics>=8.3.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wally_ai_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests that load the YOLO model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wally_ai_api"]
